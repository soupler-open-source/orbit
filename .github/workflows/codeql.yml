name: CodeQL Analysis

on:
  # CodeQL requires GitHub Advanced Security (GHAS) to upload SARIF results.
  # Disabled on pull_request until GHAS is enabled on this repository.
  # To re-enable: remove this comment block and restore the triggers below.
  push:
    branches: [ main ]
  schedule:
    # Weekly scan every Monday at 08:00 UTC
    - cron: '0 8 * * 1'

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
