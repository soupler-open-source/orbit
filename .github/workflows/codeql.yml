name: CodeQL Analysis

on:
  # CodeQL requires GitHub Advanced Security (GHAS) to upload SARIF results.
  # All event triggers are disabled until GHAS is enabled on this repository.
  # To re-enable: restore push/pull_request triggers below.
  #
  # push:
  #   branches: [ develop, main ]
  # pull_request:
  #   branches: [ develop, main ]
  schedule:
    # Weekly scan every Monday at 08:00 UTC
    # Will silently fail until GHAS is enabled — does not block PRs or pushes.
    - cron: '0 8 * * 1'

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
